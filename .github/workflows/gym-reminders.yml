# Sends the web gym reminders that are due: every 10 minutes it calls the API's
# POST /reminders/dispatch, which pushes each user's reminder at their chosen
# time (in their own timezone, once a day). The call also wakes a sleeping free
# Render instance. GitHub may start scheduled runs 10-15 minutes late; the API
# still sends a reminder up to 45 minutes after its time.
#
# Setup (repo Settings → Secrets and variables → Actions → New repository secret):
#   FORGE_API_URL         the API's base URL, e.g. https://forge-api.onrender.com
#   REMINDER_CRON_SECRET  the same value as REMINDER_CRON_SECRET on the API
# Until both are set, runs just print a notice and succeed.
name: Gym reminders

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: # "Run workflow" button, for a manual check

concurrency:
  group: gym-reminders
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send due reminders
        env:
          API_URL: ${{ secrets.FORGE_API_URL }}
          CRON_SECRET: ${{ secrets.REMINDER_CRON_SECRET }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::Gym reminders are off: add the FORGE_API_URL and REMINDER_CRON_SECRET repository secrets."
            exit 0
          fi
          # A sleeping free Render instance can take a minute to wake: retry before giving up.
          curl --fail --silent --show-error --retry 3 --retry-delay 20 --retry-all-errors --max-time 90 \
            -X POST -H "X-Cron-Secret: $CRON_SECRET" "${API_URL%/}/reminders/dispatch"
          echo
